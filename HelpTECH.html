
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="HelpTECH.css">
    <title>HelpTECH</title>
</head>

<body>

    <div class="app">

        <!-- Lado esquerdo -->
        <main class="pagina-inicial">

            <div class="logo">
                <img src="Logo.png" class="img">
                <h1>HelpTECH</h1>
            </div>

        </main>

    
        <main class="login">

            <h2>E-Mail</h2>
            <form>
                <input type="email" placeholder="Digite seu email">
            </form>

            <h2>Senha</h2>
            <form>
                <input type="senha" placeholder="Digite sua senha">
            </form>

            <button type="submit">Entrar</button>

        </main>

    </div>

</body>
</html>
